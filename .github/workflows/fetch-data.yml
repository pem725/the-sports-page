name: Fetch Data (credentialed)

# Runs the calls that need an API key, INSIDE Actions, where the secrets live.
#
# GitHub Actions secrets are write-only: nothing can read one back out, so any
# code needing a key has to run here rather than on a laptop. This job fetches,
# commits the results into data/, and everything downstream then reads committed
# data and needs no credential at all.
#
# Triggerable from a phone: repo -> Actions -> "Fetch Data (credentialed)" ->
# "Run workflow". Choose what to fetch from the dropdown.

on:
  workflow_dispatch:
    inputs:
      what:
        description: "What to fetch"
        required: true
        default: check
        type: choice
        options: [check, cfb, youtube, discover-channels, filter-exclusive, channel-volume, top50-discover, seed-channels, locked-on, lockedon-volume, cfb-jnd, cfb-upcoming, all]
      query:
        description: "Comma-separated queries/programs (youtube, discover-channels)"
        required: false
        default: "Notre Dame football"
      seed_label:
        description: "Program label for seed-channels (e.g. Notre Dame)"
        required: false
        default: "Notre Dame"
      pages:
        description: "search pages for 'youtube'; DAYS of history for 'channel-volume'"
        required: false
        default: "3"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Always smoke-test the credentials first and print the result. This is the
      # "do the keys work" answer, produced where the keys actually are. It prints
      # status codes and salted fingerprints, never a value.
      - name: Credential smoke test
        env:
          CFBD_KEY: ${{ secrets.CFBD_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.GOOGLE_SPORTSPAGE_API || secrets.YOUTUBE_API }}
        run: python3 scripts/remote_fetch.py --check

      - name: Fetch CFB data
        if: ${{ inputs.what == 'cfb' || inputs.what == 'all' }}
        env:
          CFBD_KEY: ${{ secrets.CFBD_KEY }}
        run: python3 scripts/remote_fetch.py --cfb

      - name: Discover YouTube channels
        if: ${{ inputs.what == 'discover-channels' }}
        env:
          YOUTUBE_API_KEY: ${{ secrets.GOOGLE_SPORTSPAGE_API || secrets.YOUTUBE_API }}
        run: python3 scripts/remote_fetch.py --discover "${{ inputs.query }}"

      - name: Discover channels for the top N programs
        if: ${{ inputs.what == 'top50-discover' }}
        env:
          CFBD_KEY: ${{ secrets.CFBD_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.GOOGLE_SPORTSPAGE_API || secrets.YOUTUBE_API }}
        run: python3 scripts/remote_fetch.py --top ${{ inputs.pages }}

      - name: Build the matched Locked On set
        if: ${{ inputs.what == 'locked-on' }}
        env:
          YOUTUBE_API_KEY: ${{ secrets.GOOGLE_SPORTSPAGE_API || secrets.YOUTUBE_API }}
        run: python3 scripts/remote_fetch.py --locked-on

      - name: CFB rank-gap JND history
        if: ${{ inputs.what == 'cfb-jnd' }}
        env:
          CFBD_KEY: ${{ secrets.CFBD_KEY }}
        run: python3 scripts/remote_fetch.py --cfb-jnd

      - name: CFB preseason poll and week-1 lines
        if: ${{ inputs.what == 'cfb-upcoming' }}
        env:
          CFBD_KEY: ${{ secrets.CFBD_KEY }}
        run: python3 scripts/remote_fetch.py --cfb-upcoming

      - name: Measure the Locked On set
        if: ${{ inputs.what == 'lockedon-volume' }}
        env:
          YOUTUBE_API_KEY: ${{ secrets.GOOGLE_SPORTSPAGE_API || secrets.YOUTUBE_API }}
        run: python3 scripts/remote_fetch.py --lockedon-volume --days ${{ inputs.pages }}

      - name: Resolve seed video URLs to channels
        if: ${{ inputs.what == 'seed-channels' }}
        env:
          YOUTUBE_API_KEY: ${{ secrets.GOOGLE_SPORTSPAGE_API || secrets.YOUTUBE_API }}
        run: python3 scripts/remote_fetch.py --seed-videos "${{ inputs.query }}" --seed-label "${{ inputs.seed_label }}"

      - name: Keep only football-exclusive channels
        if: ${{ inputs.what == 'filter-exclusive' }}
        env:
          YOUTUBE_API_KEY: ${{ secrets.GOOGLE_SPORTSPAGE_API || secrets.YOUTUBE_API }}
        run: python3 scripts/remote_fetch.py --filter-exclusive

      - name: Channel-based volume
        if: ${{ inputs.what == 'channel-volume' }}
        env:
          YOUTUBE_API_KEY: ${{ secrets.GOOGLE_SPORTSPAGE_API || secrets.YOUTUBE_API }}
        run: python3 scripts/remote_fetch.py --channel-volume --days ${{ inputs.pages }}

      - name: Fetch YouTube data
        if: ${{ inputs.what == 'youtube' || inputs.what == 'all' }}
        env:
          YOUTUBE_API_KEY: ${{ secrets.GOOGLE_SPORTSPAGE_API || secrets.YOUTUBE_API }}
        run: python3 scripts/remote_fetch.py --youtube "${{ inputs.query }}" --pages ${{ inputs.pages }}

      - name: Commit whatever was fetched
        if: ${{ inputs.what != 'check' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "no data changes"
          else
            git commit -m "Fetch data: ${{ inputs.what }} (workflow run ${{ github.run_number }})"
            git push
          fi
