name: Autopublish Daily Issue

on:
  schedule:
    # IMPORTANT — GitHub Actions free-tier scheduled workflows fire LATE,
    # not on time. Observed delay 1.5–2.5 hours when scheduled at the
    # popular 8:30/9:30 UTC slot (start-of-hour high-load windows).
    # See: https://docs.github.com/en/actions/reference/events-that-trigger-workflows#schedule
    #
    # Strategy: schedule earlier and at off-hour minutes to land in a
    # lower-load window, plus stack several entries spread across ~3
    # hours so at least one fires by the target time.
    #
    # already_published_today() guard in scripts/autopublish.py means only
    # the first run to succeed does work; subsequent runs exit immediately.
    # Safe to over-schedule.
    #
    # During EDT (Mar–Nov), the four cron entries below map to:
    #   2:30 AM ET → delayed avg ~4:00 AM ET (primary; this should be
    #                the one that wins the race on most mornings)
    #   3:00 AM ET → delayed avg ~4:30 AM ET (1st backup)
    #   4:30 AM ET → delayed avg ~6:00 AM ET (2nd backup)
    #   5:30 AM ET → delayed avg ~7:00 AM ET (3rd backup — final safety)
    #
    # During EST (Nov–Mar), subtract one hour from each ET time. Still fine.
    # Minutes deliberately ODD and off the hour. GitHub's docs warn that :00 and
    # :30 are the most congested slots, and every one of ours sat on them.
    # Editing this file also re-registers the schedule, which is GitHub's own
    # advice for workflows stuck on a stale/delayed schedule.
    - cron: '7 6 * * 1-6'    # 06:07 UTC - 2:07 AM EDT - earliest
    - cron: '23 7 * * 1-6'   # 07:23 UTC - 3:23 AM EDT
    - cron: '41 8 * * 1-6'   # 08:41 UTC - 4:41 AM EDT
    - cron: '13 10 * * 1-6'  # 10:13 UTC - 6:13 AM EDT
    - cron: '29 11 * * 1-6'  # 11:29 UTC - 7:29 AM EDT - last resort

  # Manual trigger from GitHub UI (Actions tab → Run workflow)
  workflow_dispatch:

permissions:
  contents: write    # push commits
  issues: write      # create failure issues

# A red ✗ reading "The job was not acquired by Runner of type hosted" is a
# GitHub capacity hiccup, NOT a bug here: the job never started, so nothing
# can retry it in-workflow. It is harmless — the stacked cron entries above
# plus already_published_today() mean a later run publishes the day's issue
# instead (as happened 2026-07-27). To stop the failure emails for these,
# adjust GitHub notification settings, not this file. In-our-control transient
# failures (the git-push race, network blips) are handled by safe_push() in
# scripts/autopublish.py.
jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Report scheduling lateness
        run: |
          echo "event: ${{ github.event_name }}   slot: ${{ github.event.schedule }}"
          echo "now:   $(date -u '+%Y-%m-%d %H:%M') UTC"
          SLOT="${{ github.event.schedule }}"
          if [ -n "$SLOT" ]; then
            MI=$(echo $SLOT | cut -d" " -f1); HR=$(echo $SLOT | cut -d" " -f2)
            DUE=$(date -u -d "today ${HR}:${MI}" +%s); NOW=$(date -u +%s)
            [ $DUE -gt $NOW ] && DUE=$((DUE-86400))
            LATE=$(( (NOW-DUE)/60 ))
            echo "scheduled ${HR}:${MI} UTC, ran $(date -u +%H:%M) UTC -> ${LATE} minutes late"
            [ $LATE -gt 120 ] && echo "::warning::scheduled run was ${LATE} minutes late"
          fi

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history for git log

      - name: Configure git identity
        run: |
          git config user.name "The Sports Page Bot"
          git config user.email "sports-page-bot@users.noreply.github.com"

      # Without this the OG card generator cannot import PIL/cairosvg and every
      # social share card fails to render. That went unnoticed for ~40 issues.
      - name: Install Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcairo2
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet -r requirements.txt
          python3 -c "import PIL, cairosvg; print('deps ok:', PIL.__version__, cairosvg.__version__)"

      # Must run BEFORE the publish so the block exists when the issue is stamped.
      # continue-on-error: a missing leverage table removes its own marker and the
      # issue ships without it. Never block a publish on a nice-to-have.
      - name: Build the What to Watch block
        continue-on-error: true
        run: python3 scripts/daily_watch.py || echo "::warning::watch block unavailable; issue will ship without it"

      - name: Run autopublish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/autopublish.py

      # Refreshes the Odds Board. Deliberately piggybacks on this workflow rather
      # than taking its own schedule: a second cron would inherit the same GitHub
      # scheduling delays that already push this job hours late, and would then
      # race this one for the push. Runs AFTER the publish so a failure here can
      # never block an issue going out.
      - name: Refresh the Odds Board
        continue-on-error: true
        run: |
          python3 scripts/refresh_about.py || echo "::warning::about.html refresh failed"
          CFBD_KEY="${{ secrets.CFBD_KEY }}" python3 scripts/build_cfb_odds.py || echo "::warning::CFB projections unavailable; the board keeps yesterday's"
          python3 scripts/refresh_odds.py || { echo "::warning::odds refresh failed; the previous board stays up"; exit 0; }
          if git diff --quiet -- odds.html data/playoff-odds-trajectory.json data/cfb-odds.json about.html; then
            echo "no change to the board"; exit 0
          fi
          git add odds.html data/playoff-odds-trajectory.json data/cfb-odds.json about.html
          git commit -m "Refresh the board, CFB projections and about page ($(date -u '+%Y-%m-%d'))"
          for i in 1 2 3; do
            git pull --rebase --quiet origin main && git push --quiet origin main && { echo "board pushed"; exit 0; }
            echo "push race on attempt $i; retrying"; sleep 5
          done
          echo "::warning::could not push the refreshed board after 3 attempts"

      - name: Verify push succeeded
        run: |
          echo "Last commit:"
          git log --oneline -1
          echo ""
          echo "Published files:"
          ls published/ | wc -l
