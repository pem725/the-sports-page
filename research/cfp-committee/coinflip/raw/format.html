ile-content-wrapper" data-v-f4f9d33a data-v-650416e6><span data-v-650416e6></span><!----><div data-sidearm-html="true" data-safe-html="true" class="sportfile-content max-w-none prose" data-v-650416e6><!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About the 12-Team Format</title>
<style>

  /* ======================================================================
     THEME VARIABLES
     Identical names/values to the chronology + overview templates, so all
     three pages stay visually in sync.
     ====================================================================== */
  :root {
    --color-text: #000000;
    --color-text-secondary: #666666;
    --color-text-muted: #999999;
    --color-border: #e0e0e0;
    --color-surface: #ffffff;
    --color-page-bg: #fafafa;
    --color-accent: #c9920e;
    --color-accent-bg: #fbf3e2;
    --color-accent-text: #000000;
    --radius: 8px;
  }

  * { box-sizing: border-box; }

  .format-wrap {
    font-family: var(--font-family);
    color: var(--color-text);
    background: transparent;
    width: 100%;
    padding: 24px 16px 48px;
  }

  .format-main {
    width: 100%;
    margin: 0;
  }

  /* ---------- Intro ---------- */
  .format-intro { margin-bottom: 28px; }

  .format-intro p {
    margin: 0;
    max-width: 640px;
    color: var(--color-text-secondary);
    font-size: 15px;
    line-height: 1.6;
  }

  /* ---------- Quick facts strip ---------- */
  .stat-strip {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin: 20px 0 4px;
  }
  .stat-card {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    padding: 14px 10px;
    text-align: center;
  }
  .stat-card .num {
    font-size: 22px;
    font-weight: 700;
    color: var(--color-accent-text);
    line-height: 1.1;
  }
  .stat-card .label {
    margin-top: 4px;
    font-size: 11px;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    color: var(--color-text-muted);
  }

  /* ---------- Sections ---------- */
  .format-section {
    margin-top: 44px;
    padding-top: 4px;
    scroll-margin-top: 24px;
  }
  .format-section h2 {
    display: flex;
    align-items: center;
    min-height: 52px;
    font-size: 20px;
    font-weight: 700;
    color: #ffffff;
    background: #1a1a1a;
    padding: 0 14px;
    margin: 0 0 14px;
    border-radius: 0;
    letter-spacing: -0.1px;
  }
  .format-section p.muted {
    color: var(--color-text-secondary);
    font-size: 14.5px;
    line-height: 1.65;
    max-width: 820px;
    margin: 0 0 16px;
  }
  .format-section p.muted.full-width {
    max-width: none;
  }

  /* ---------- Rules section layout (text + infographic side by side) ---------- */
  .rules-layout {
    display: grid;
    grid-template-columns: 1.6fr minmax(260px, 380px);
    gap: 24px;
    align-items: start;
  }
  .rules-layout .figure-stack {
    display: flex;
    flex-direction: column;
    gap: 16px;
    position: sticky;
    top: 24px;
  }
  .rules-layout .format-figure { margin-top: 0; }

  /* ---------- Rule cards (unordered — badge is a marker, not a number) ---------- */
  .rule-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin: 18px 0 0;
    padding: 0;
    list-style: none;
  }
  .rule-list li {
    position: relative;
    display: flex;
    gap: 14px;
    align-items: flex-start;
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    padding: 14px 16px 14px 14px;
    font-size: 14px;
    line-height: 1.6;
    color: var(--color-text);
  }
  .rule-list li::before {
    content: "";
    flex-shrink: 0;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: radial-gradient(circle at center, var(--color-accent-text) 3px, var(--color-accent-bg) 4px);
    margin-top: 1px;
  }

  /* ---------- Seeding allocation cards (matches stat-card style) ---------- */
  .alloc-cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin: 18px 0 4px;
  }
  .alloc-card {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    padding: 18px 14px;
    text-align: center;
  }
  .alloc-card .alloc-num {
    font-size: 30px;
    font-weight: 700;
    color: var(--color-accent-text);
    line-height: 1.1;
  }
  .alloc-card .alloc-label {
    margin-top: 6px;
    font-size: 15px;
    font-weight: 700;
    color: var(--color-text);
  }
  .alloc-card .alloc-sub {
    margin-top: 4px;
    font-size: 15px;
    color: var(--color-text-secondary);
  }

  @media (max-width: 640px) {
    .alloc-cards { grid-template-columns: 1fr; }
  }

  /* ---------- Callout ---------- */
  .callout {
    border-left: 3px solid var(--color-accent);
    background: var(--color-accent-bg);
    padding: 14px 18px;
    border-radius: 0 var(--radius) var(--radius) 0;
    margin: 18px 0 0;
    font-size: 14px;
    color: var(--color-accent-text);
    line-height: 1.6;
  }
  .callout b, .callout strong { color: var(--color-accent-text); }

  /* ---------- Bracket ---------- */
  .bracket-scroll {
    overflow-x: auto;
    padding-bottom: 8px;
    margin-top: 20px;
  }
  .bracket {
    display: grid;
    grid-template-columns: repeat(4, minmax(190px, 1fr));
    gap: 18px;
    min-width: 800px;
  }
  .bracket-round-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--color-accent-text);
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 6px;
  }
  .bracket-round-label span {
    color: var(--color-text-muted);
    font-size: 10px;
    letter-spacing: 0.2px;
    text-transform: none;
    font-weight: 600;
  }
  .matchup {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    margin-bottom: 12px;
    overflow: hidden;
  }
  .matchup.champ {
    border-color: var(--color-accent);
    box-shadow: 0 0 0 1px var(--color-accent) inset;
  }
  .seedrow {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 12px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--color-text);
  }
  .seedrow + .seedrow { border-top: 1px solid var(--color-border); }
  .seedrow.bye { color: var(--color-text-muted); font-style: italic; }
  .seedrow .n {
    flex-shrink: 0;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--color-accent-bg);
    color: var(--color-accent-text);
    font-size: 11px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    font-style: normal;
  }

  /* ---------- Schedule cards ---------- */
  .schedule-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-top: 18px;
  }
  .schedule-card {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    padding: 16px;
  }
  .schedule-card .round {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--color-accent-text);
    margin-bottom: 8px;
  }
  .schedule-card .date {
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .schedule-card .game {
    font-size: 13px;
    color: var(--color-text-secondary);
    line-height: 1.6;
    padding: 4px 0;
    border-top: 1px solid var(--color-border);
  }
  .schedule-card .game:first-of-type { border-top: none; padding-top: 0; }
  .schedule-card.champ {
    border-color: var(--color-accent);
    background: var(--color-accent-bg);
  }
  .schedule-card.champ .game { border-top-color: rgba(201, 146, 14, 0.25); color: var(--color-accent-text); }
  .schedule-card.champ .venue {
    font-size: 12px;
    color: var(--color-accent-text);
    margin-top: 6px;
  }

  /* ---------- Infographic / bracket images ---------- */
  .format-figure {
    margin-top: 22px;
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    padding: 14px;
    text-align: center;
  }
  .format-figure img {
    max-width: 100%;
    height: auto;
    border-radius: 4px;
    display: block;
    margin: 0 auto;
  }
  .format-figure .caption {
    margin-top: 10px;
    font-size: 12px;
    color: var(--color-text-muted);
  }

  /* ---------- Responsive ---------- */
  @media (max-width: 900px) {
    .rules-layout { grid-template-columns: 1fr; }
    .rules-layout .figure-stack { position: static; }
    .intro-layout { grid-template-columns: 1fr; }
  }

  @media (max-width: 720px) {
    .stat-strip { grid-template-columns: repeat(2, 1fr); }
    .schedule-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>

<!--          <p class="muted">Five conference champions earn automatic bids. The top four are seeded 1&ndash;4 and receive a first-round bye. The next seven highest-ranked teams &mdash; plus Notre Dame, if ranked in the top 12 &mdash; round out the field, seeded strictly by the selection committee's final rankings.</p>-->

            </div>

              <div class="alloc-label">Automatic Bid</div>
              <div class="alloc-sub">Highest-ranked team from the <a href="https://theamerican.org/" target="_blank" style="color: #c9920e; font-weight: 600;">American</a>, <a href="https://conferenceusa.com/" target="_blank" style="color: #c9920e; font-weight: 600;">Conference USA</a>, <a href="https://getsomemaction.com/" target="_blank" style="color: #c9920e; font-weight: 600;">MAC</a>, <a href="https://themw.com/" target="_blank" style="color: #c9920e; font-weight: 600;">Mountain West</a>, <a href="https://pac-12.com/" target="_blank" style="color: #c9920e; font-weight: 600;">Pac-12</a> or <a href="https://sunbeltsports.org/" target="_blank" style="color: #c9920e; font-weight: 600;">Sun Belt</a></div>
            </div>
            <div class="alloc-card">
              <div class="alloc-num">7</div>
              <div class="alloc-label">At-Large Bids</div>
              <div class="alloc-sub">Best remaining teams, any conference</div>
            </div>
          </div>

          <ul class="rule-list">
        <li><a href="https://fightingirish.com/" target="_blank" style="color: #c9920e; font-weight: 600;">Notre Dame</a> receives an automatic bid if it is ranked in the CFP Top 12 on Selection Day. If so, six (6) at-large bids would be awarded.</li>
        <li>Seeds 1-4 receive first-round byes</li>
        <li>Seeds 5-12 play first-round games at the higher seed's home stadium</li>
        <li>Any automatic qualifiers ranked outside the top 12 will be placed in order at the bottom of the seeding.</li>

			<li>The No. 1 seed will select its quarterfinal bowl site and the semifinal site into which it will advance should it win its quarterfinal game.</li>

			<li>The No. 2 seed, followed by the No. 3 seed, will then select from the remaining quarterfinal bowl sites. Those two teams will be assigned to the remaining semifinal.</li>

			<li>The No. 4 seed will be assigned to the remaining quarterfinal bowl site.</li>

			<li>With the four highest-ranked schools' bowls selected, their four CFP Quarterfinal opponents will be dictated by the bracket (i.e., No. 1 vs. No. 8/9 winner, No. 4 vs. No. 5/12 winner, No. 2 vs. 7/10 winner; No. 3 vs. 6/11 winner.)</li>

			<li>The CFP bracket will follow the selection committee’s rankings, with no modifications made to avoid rematches between teams that may have played during the regular season or are from the same conference.</li>

			<li>The bracket will remain in effect throughout the CFP (i.e., no re-seeding).</li>

			<li>All 11 games will be under the CFP umbrella with the administrative policies determined by the CFP.</li>

lor-surface: #ffffff;\r\n    --color-page-bg: #fafafa;\r\n    --color-accent: #c9920e;\r\n    --color-accent-bg: #fbf3e2;\r\n    --color-accent-text: #000000;\r\n    --radius: 8px;\r\n  }\r\n\r\n  * { box-sizing: border-box; }\r\n\r\n  .format-wrap {\r\n    font-family: var(--font-family);\r\n    color: var(--color-text);\r\n    background: transparent;\r\n    width: 100%;\r\n    padding: 24px 16px 48px;\r\n  }\r\n\r\n  .format-main {\r\n    width: 100%;\r\n    margin: 0;\r\n  }\r\n\r\n  \u002F* ---------- Intro ---------- *\u002F\r\n  .format-intro { margin-bottom: 28px; }\r\n\r\n  .format-intro p {\r\n    margin: 0;\r\n    max-width: 640px;\r\n    color: var(--color-text-secondary);\r\n    font-size: 15px;\r\n    line-height: 1.6;\r\n  }\r\n\r\n  \u002F* ---------- Quick facts strip ---------- *\u002F\r\n  .stat-strip {\r\n    display: grid;\r\n    grid-template-columns: repeat(2, 1fr);\r\n    gap: 10px;\r\n    margin: 20px 0 4px;\r\n  }\r\n  .stat-card {\r\n    background: var(--color-surface);\r\n    border: 1px solid var(--color-border);\r\n    border-radius: var(--radius);\r\n    padding: 14px 10px;\r\n    text-align: center;\r\n  }\r\n  .stat-card .num {\r\n    font-size: 22px;\r\n    font-weight: 700;\r\n    color: var(--color-accent-text);\r\n    line-height: 1.1;\r\n  }\r\n  .stat-card .label {\r\n    margin-top: 4px;\r\n    font-size: 11px;\r\n    letter-spacing: 0.4px;\r\n    text-transform: uppercase;\r\n    color: var(--color-text-muted);\r\n  }\r\n\r\n  \u002F* ---------- Sections ---------- *\u002F\r\n  .format-section {\r\n    margin-top: 44px;\r\n    padding-top: 4px;\r\n    scroll-margin-top: 24px;\r\n  }\r\n  .format-section h2 {\r\n    display: flex;\r\n    align-items: center;\r\n    min-height: 52px;\r\n    font-size: 20px;\r\n    font-weight: 700;\r\n    color: #ffffff;\r\n    background: #1a1a1a;\r\n    padding: 0 14px;\r\n    margin: 0 0 14px;\r\n    border-radius: 0;\r\n    letter-spacing: -0.1px;\r\n  }\r\n  .format-section p.muted {\r\n    color: var(--color-text-secondary);\r\n    font-size: 14.5px;\r\n    line-height: 1.65;\r\n    max-width: 820px;\r\n    margin: 0 0 16px;\r\n  }\r\n  .format-section p.muted.full-width {\r\n    max-width: none;\r\n  }\r\n\r\n  \u002F* ---------- Rules section layout (text + infographic side by side) ---------- *\u002F\r\n  .rules-layout {\r\n    display: grid;\r\n    grid-template-columns: 1.6fr minmax(260px, 380px);\r\n    gap: 24px;\r\n    align-items: start;\r\n  }\r\n  .rules-layout .figure-stack {\r\n    display: flex;\r\n    flex-direction: column;\r\n    gap: 16px;\r\n    position: sticky;\r\n    top: 24px;\r\n  }\r\n  .rules-layout .format-figure { margin-top: 0; }\r\n\r\n  \u002F* ---------- Rule cards (unordered — badge is a marker, not a number) ---------- *\u002F\r\n  .rule-list {\r\n    display: flex;\r\n    flex-direction: column;\r\n    gap: 10px;\r\n    margin: 18px 0 0;\r\n    padding: 0;\r\n    list-style: none;\r\n  }\r\n  .rule-list li {\r\n    position: relative;\r\n    display: flex;\r\n    gap: 14px;\r\n    align-items: flex-start;\r\n    background: var(--color-surface);\r\n    border: 1px solid var(--color-border);\r\n    border-radius: var(--radius);\r\n    padding: 14px 16px 14px 14px;\r\n    font-size: 14px;\r\n    line-height: 1.6;\r\n    color: var(--color-text);\r\n  }\r\n  .rule-list li::before {\r\n    content: \"\";\r\n    flex-shrink: 0;\r\n    width: 24px;\r\n    height: 24px;\r\n    border-radius: 50%;\r\n    background: radial-gradient(circle at center, var(--color-accent-text) 3px, var(--color-accent-bg) 4px);\r\n    margin-top: 1px;\r\n  }\r\n\r\n  \u002F* ---------- Seeding allocation cards (matches stat-card style) ---------- *\u002F\r\n  .alloc-cards {\r\n    display: grid;\r\n    grid-template-columns: repeat(3, 1fr);\r\n    gap: 12px;\r\n    margin: 18px 0 4px;\r\n  }\r\n  .alloc-card {\r\n    background: var(--color-surface);\r\n    border: 1px solid var(--color-border);\r\n    border-radius: var(--radius);\r\n    padding: 18px 14px;\r\n    text-align: center;\r\n  }\r\n  .alloc-card .alloc-num {\r\n    font-size: 30px;\r\n    font-weight: 700;\r\n    color: var(--color-accent-text);\r\n    line-height: 1.1;\r\n  }\r\n  .alloc-card .alloc-label {\r\n    margin-top: 6px;\r\n    font-size: 15px;\r\n    font-weight: 700;\r\n    color: var(--color-text);\r\n  }\r\n  .alloc-card .alloc-sub {\r\n    margin-top: 4px;\r\n    font-size: 15px;\r\n    color: var(--color-text-secondary);\r\n  }\r\n\r\n  @media (max-width: 640px) {\r\n    .alloc-cards { grid-template-columns: 1fr; }\r\n  }\r\n\r\n  \u002F* ---------- Callout ---------- *\u002F\r\n  .callout {\r\n    border-left: 3px solid var(--color-accent);\r\n    background: var(--color-accent-bg);\r\n    padding: 14px 18px;\r\n    border-radius: 0 var(--radius) var(--radius) 0;\r\n    margin: 18px 0 0;\r\n    font-size: 14px;\r\n    color: var(--color-accent-text);\r\n    line-height: 1.6;\r\n  }\r\n  .callout b, .callout strong { color: var(--color-accent-text); }\r\n\r\n  \u002F* ---------- Bracket ---------- *\u002F\r\n  .bracket-scroll {\r\n    overflow-x: auto;\r\n    padding-bottom: 8px;\r\n    margin-top: 20px;\r\n  }\r\n  .bracket {\r\n    display: grid;\r\n    grid-template-columns: repeat(4, minmax(190px, 1fr));\r\n    gap: 18px;\r\n    min-width: 800px;\r\n  }\r\n  .bracket-round-label {\r\n    font-size: 11px;\r\n    font-weight: 700;\r\n    letter-spacing: 1.2px;\r\n    text-transform: uppercase;\r\n    color: var(--color-accent-text);\r\n    margin-bottom: 10px;\r\n    display: flex;\r\n    justify-content: space-between;\r\n    align-items: baseline;\r\n    gap: 6px;\r\n  }\r\n  .bracket-round-label span {\r\n    color: var(--color-text-muted);\r\n    font-size: 10px;\r\n    letter-spacing: 0.2px;\r\n    text-transform: none;\r\n    font-weight: 600;\r\n  }\r\n  .matchup {\r\n    background: var(--color-surface);\r\n    border: 1px solid var(--color-border);\r\n    border-radius: var(--radius);\r\n    margin-bottom: 12px;\r\n    overflow: hidden;\r\n  }\r\n  .matchup.champ {\r\n    border-color: var(--color-accent);\r\n    box-shadow: 0 0 0 1px var(--color-accent) inset;\r\n  }\r\n  .seedrow {\r\n    display: flex;\r\n    align-items: center;\r\n    gap: 8px;\r\n    padding: 9px 12px;\r\n    font-size: 12.5px;\r\n    font-weight: 600;\r\n    color: var(--color-text);\r\n  }\r\n  .seedrow + .seedrow { border-top: 1px solid var(--color-border); }\r\n  .seedrow.bye { color: var(--color-text-muted); font-style: italic; }\r\n  .seedrow .n {\r\n    flex-shrink: 0;\r\n    width: 20px;\r\n    height: 20px;\r\n    border-radius: 50%;\r\n    background: var(--color-accent-bg);\r\n    color: var(--color-accent-text);\r\n    font-size: 11px;\r\n    font-weight: 700;\r\n    display: flex;\r\n    align-items: center;\r\n    justify-content: center;\r\n    font-style: normal;\r\n  }\r\n\r\n  \u002F* ---------- Schedule cards ---------- *\u002F\r\n  .schedule-grid {\r\n    display: grid;\r\n    grid-template-columns: repeat(4, 1fr);\r\n    gap: 12px;\r\n    margin-top: 18px;\r\n  }\r\n  .schedule-card {\r\n    background: var(--color-surface);\r\n    border: 1px solid var(--color-border);\r\n    border-radius: var(--radius);\r\n    padding: 16px;\r\n  }\r\n  .schedule-card .round {\r\n    font-size: 10.5px;\r\n    font-weight: 700;\r\n    letter-spacing: 1px;\r\n    text-transform: uppercase;\r\n    color: var(--color-accent-text);\r\n    margin-bottom: 8px;\r\n  }\r\n  .schedule-card .date {\r\n    font-size: 13px;\r\n    font-weight: 700;\r\n    margin-bottom: 8px;\r\n  }\r\n  .schedule-card .game {\r\n    font-size: 13px;\r\n    color: var(--color-text-secondary);\r\n    line-height: 1.6;\r\n    padding: 4px 0;\r\n    border-top: 1px solid var(--color-border);\r\n  }\r\n  .schedule-card .game:first-of-type { border-top: none; padding-top: 0; }\r\n  .schedule-card.champ {\r\n    border-color: var(--color-accent);\r\n    background: var(--color-accent-bg);\r\n  }\r\n  .schedule-card.champ .game { border-top-color: rgba(201, 146, 14, 0.25); color: var(--color-accent-text); }\r\n  .schedule-card.champ .venue {\r\n    font-size: 12px;\r\n    color: var(--color-accent-text);\r\n    margin-top: 6px;\r\n  }\r\n\r\n  \u002F* ---------- Infographic \u002F bracket images ---------- *\u002F\r\n  .format-figure {\r\n    margin-top: 22px;\r\n    background: var(--color-surface);\r\n    border: 1px solid var(--color-border);\r\n    border-radius: var(--radius);\r\n    padding: 14px;\r\n    text-align: center;\r\n  }\r\n  .format-figure img {\r\n    max-width: 100%;\r\n    height: auto;\r\n    border-radius: 4px;\r\n    display: block;\r\n    margin: 0 auto;\r\n  }\r\n  .format-figure .caption {\r\n    margin-top: 10px;\r\n    font-size: 12px;\r\n    color: var(--color-text-muted);\r\n  }\r\n\r\n  \u002F* ---------- Responsive ---------- *\u002F\r\n  @media (max-width: 900px) {\r\n    .rules-layout { grid-template-columns: 1fr; }\r\n    .rules-layout .figure-stack { position: static; }\r\n    .intro-layout { grid-template-columns: 1fr; }\r\n  }\r\n\r\n  @media (max-width: 720px) {\r\n    .stat-strip { grid-template-columns: repeat(2, 1fr); }\r\n    .schedule-grid { grid-template-columns: repeat(2, 1fr); }\r\n  }\r\n\u003C\u002Fstyle>\r\n\u003C\u002Fhead>\r\n\u003Cbody>\r\n\r\n\u003Cdiv class=\"format-wrap\">\r\n  \u003Cmain class=\"format-main\">\r\n\r\n\u003C!--    \u003Cdiv class=\"format-intro\">\r\n      \u003Cp>The 12-team field mixes automatic qualifiers with at-large selections, rewards the top four seeds with a first-round bye, and keeps the sport's historic bowl games at the center of the postseason.\u003C\u002Fp>\r\n\r\n      \u003Cdiv class=\"stat-strip\">\r\n        \u003Cdiv class=\"stat-card\">\u003Cdiv class=\"num\">12\u003C\u002Fdiv>\u003Cdiv class=\"label\">Teams\u003C\u002Fdiv>\u003C\u002Fdiv>\r\n        \u003Cdiv class=\"stat-card\">\u003Cdiv class=\"num\">4\u003C\u002Fdiv>\u003Cdiv class=\"label\">First-Round Byes\u003C\u002Fdiv>\u003C\u002Fdiv>\r\n        \u003Cdiv class=\"stat-card\">\u003Cdiv class=\"num\">3\u003C\u002Fdiv>\u003Cdiv class=\"label\">Rounds to the Title\u003C\u002Fdiv>\u003C\u002Fdiv>\r\n        \u003Cdiv class=\"stat-card\">\u003Cdiv class=\"num\">Mon.\u003C\u002Fdiv>\u003Cdiv class=\"label\">Championship Night\u003C\u002Fdiv>\u003C\u002Fdiv>\r\n      \u003C\u002Fdiv>\r\n    \u003C\u002Fdiv> -->\r\n\r\n    \u003C!-- ================= HOW THE FIELD IS SET ================= -->\r\n    \u003Csection class=\"format-section\" id=\"rules\">\r\n      \u003Ch2>How the CFP Field Is Set\u003C\u002Fh2>\r\n\r\n      \u003Cdiv class=\"rules-layout\">\r\n        \u003Cdiv>\r\n\u003C!--          \u003Cp class=\"muted\">Five conference champions earn automatic bids. The top four are seeded 1&ndash;4 and receive a first-round bye. The next seven highest-ranked teams &mdash; plus Notre Dame, if ranked in the top 12 &mdash; round out the field, seeded strictly by the selection committee's final rankings.\u003C\u002Fp>-->\r\n\r\n          \u003Cdiv class=\"alloc-cards\">\r\n            \u003Cdiv class=\"alloc-card\">\r\n              \u003Cdiv class=\"alloc-num\">4\u003C\u002Fdiv>\r\n              \u003Cdiv class=\"alloc-label\">Automatic Bids\u003C\u002Fdiv>\r\n              \u003Cdiv class=\"alloc-sub\">\u003Ca href=\"https:\u002F\u002Ftheacc.com\u002F\" target=\"_blank\" style=\"color: #c9920e; font-weight: 600;\">ACC\u003C\u002Fa>, \u003Ca href=\"https:\u002F\u002Fbigten.org\u002F\" target=\"_blank\" style=\"color: #c9920e; font-weight: 600;\">Big Ten\u003C\u002Fa>, \u003Ca href=\"https:\u002F\u002Fbig12sports.com\u002F\" target=\"_blank\" style=\"color: #c9920e; font-weight: 600;\">Big 12\u003C\u002Fa> &amp; \u003Ca href=\"https:\u002F\u002Fwww.secsports.com\u002F\" target=\"_blank\" style=\"color: #c9920e; font-weight: 600;\">SEC\u003C\u002Fa> Champions\u003C\u002Fdiv>\r\n            \u003C\u002Fdiv>\r\n            \u003Cdiv class=\"alloc-card\">\r\n              \u003Cdiv class=\"alloc-num\">1\u003C\u002Fdiv>\r\n              \u003Cdiv class=\"alloc-label\">Automatic Bid\u003C\u002Fdiv>\r\n              \u003Cdiv class=\"alloc-sub\">Highest-ranked team from the \u003Ca href=\"https:\u002F\u002Ftheamerican.org\u002F\" target=\"_blank\" style=\"color: #c9920e; font-weight: 600;\">American\u003C\u002Fa>, \u003Ca href=\"https:\u002F\u002Fconferenceusa.com\u002F\" target=\"_blank\" style=\"color: #c9920e; font-weight: 600;\">Conference USA\u003C\u002Fa>, \u003Ca href=\"https:\u002F\u002Fgetsomemaction.com\u002F\" target=\"_blank\" style=\"color: #c9920e; font-weight: 600;\">MAC\u003C\u002Fa>, \u003Ca href=\"https:\u002F\u002Fthemw.com\u002F\" target=\"_blank\" style=\"color: #c9920e; font-weight: 600;\">Mountain West\u003C\u002Fa>, \u003Ca href=\"https:\u002F\u002Fpac-12.com\u002F\" target=\"_blank\" style=\"color: #c9920e; font-weight: 600;\">Pac-12\u003C\u002Fa> or \u003Ca href=\"https:\u002F\u002Fsunbeltsports.org\u002F\" target=\"_blank\" style=\"color: #c9920e; font-weight: 600;\">Sun Belt\u003C\u002Fa>\u003C\u002Fdiv>\r\n            \u003C\u002Fdiv>\r\n            \u003Cdiv class=\"alloc-card\">\r\n              \u003Cdiv class=\"alloc-num\">7\u003C\u002Fdiv>\r\n              \u003Cdiv class=\"alloc-label\">At-Large Bids\u003C\u002Fdiv>\r\n              \u003Cdiv class=\"alloc-sub\">Best remaining teams, any conference\u003C\u002Fdiv>\r\n            \u003C\u002Fdiv>\r\n          \u003C\u002Fdiv>\r\n\r\n          \u003Cul class=\"rule-list\">\r\n        \u003Cli>\u003Ca href=\"https:\u002F\u002Ffightingirish.com\u002F\" target=\"_blank\" style=\"color: #c9920e; font-weight: 600;\">Notre Dame\u003C\u002Fa> receives an automatic bid if it is ranked in the CFP Top 12 on Selection Day. If so, six (6) at-large bids would be awarded.\u003C\u002Fli>\r\n        \u003Cli>Seeds 1-4 receive first-round byes\u003C\u002Fli>\r\n        \u003Cli>Seeds 5-12 play first-round games at the higher seed's home stadium\u003C\u002Fli>\r\n        \u003Cli>Any automatic qualifiers ranked outside the top 12 will be placed in order at the bottom of the seeding.\u003C\u002Fli>\r\n\r\n\t\t\t\u003Cli>The No. 1 seed will select its quarterfinal bowl site and the semifinal site into which it will advance should it win its quarterfinal game.\u003C\u002Fli>\r\n\r\n\t\t\t\u003Cli>The No. 2 seed, followed by the No. 3 seed, will then select from the remaining quarterfinal bowl sites. Those two teams will be assigned to the remaining semifinal.\u003C\u002Fli>\r\n\r\n\t\t\t\u003Cli>The No. 4 seed will be assigned to the remaining quarterfinal bowl site.\u003C\u002Fli>\r\n\r\n\t\t\t\u003Cli>With the four highest-ranked schools' bowls selected, their four CFP Quarterfinal opponents will be dictated by the bracket (i.e., No. 1 vs. No. 8\u002F9 winner, No. 4 vs. No. 5\u002F12 winner, No. 2 vs. 7\u002F10 winner; No. 3 vs. 6\u002F11 winner.)\u003C\u002Fli>\r\n\r\n\t\t\t\u003Cli>The CFP bracket will follow the selection committee’s rankings, with no modifications made to avoid rematches between teams that may have played during the regular season or are from the same conference.\u003C\u002Fli>\r\n\r\n\t\t\t\u003Cli>The bracket will remain in effect throughout the CFP (i.e., no re-seeding).\u003C\u002Fli>\r\n\r\n\t\t\t\u003Cli>All 11 games will be under the CFP umbrella with the administrative policies determined by the CFP.\u003C\u002Fli>\r\n          \u003C\u002Ful>\r\n\r\n\u003C!--          \u003Cdiv class=\"callout\">\u003Cstrong>text\u002Fdiv> -->\r\n        \u003C\u002Fdiv>\r\n\r\n        \u003Cdiv class=\"figure-stack\">\r\n          \u003Cdiv class=\"format-figure\">\r\n            \u003Ca href=\"\u002Fdocuments\u002F2026\u002F9\u002F30\u002F2027_Team_Infographic_Vert_Final.pdf\" target=\"_blank\" rel=\"noopener\">\r\n              \u003Cimg src=\"\u002Fimages\u002F2026\u002F9\u002F30\u002F2027_Team_Infographic_Vert_Final.jpg\" alt=\"2026-27 College Football Playoff Infographic\">\r\n            \u003C\u002Fa>\r\n            \u003Cdiv class=\"caption\">2026-27 CFP Infographic\u003Cbr \u002F>Click \u003Ca href=\"\u002Fdocuments\u002F2026\u002F9\u002F30\u002F2027_Team_Infographic_Vert_Final.pdf\" style=\"color: #c9920e; font-weight: 600;\">here\u003C\u002Fa> to open the full PDF.\u003C\u002Fdiv>\r\n          \u003C\u002Fdiv>\r\n\r\n          \u003Cdiv class=\"format-figure\">\r\n            \u003Ca href=\"https:\u002F\u002Fcollegefootballplayoff.com\u002Fdocuments\u002F2026\u002F7\u002F14\u002F2027_StandardizedBracket_2_R1.pdf\" target=\"_blank\" rel=\"noopener\">\r\n              \u003Cimg src=\"https:\u002F\u002Fcollegefootballplayoff.com\u002Fimages\u002F2026\u002F7\u002F14\u002F2027_StandardizedBracket_2_R1.jpg\" alt=\"2026-27 College Football Playoff Bracket\">\r\n            \u003C\u002Fa>\r\n            \u003Cdiv class=\"caption\">2026-27 CFP Bracket\u003Cbr \u002F>Click \u003Ca href=\"\u002Fdocuments\u002F2026\u002F7\u002F14\u002F2027_StandardizedBracket_2_R1.pdf\" style=\"color: #c9920e; font-weight: 600;\">here\u003C\u002Fa> to open the full PDF.\u003C\u002Fdiv>\r\n          \u003C\u002Fdiv>\r\n        \u003C\u002Fdiv>\r\n      \u003C\u002Fdiv>\r\n    \u003C\u002Fsection>\r\n\r\n    \u003C!-- ================= THE BRACKET ================= -->\r\n    \u003Csection class=\"format-section\" id=\"bracket\">\r\n      \u003Ch2>The CFP Bracket\u003C\u002Fh2>\r\n\r\n      \u003Cdiv class=\"bracket-scroll\">\r\n      \u003Cdiv class=\"bracket\">\r\n          \u003Cdiv>\r\n            \u003Cdiv class=\"bracket-round-label\">CFP First Round \u003Cspan>Higher Seed Hosts\u003C\u002Fspan>\u003C\u002Fdiv>\r\n            \u003Cdiv class=\"matchup\">\u003Cdiv class=\"seedrow\">\u003Cspan class=\"n\">12\u003C\u002Fspan>Seed\u003C\u002Fdiv>\u003Cdiv class=\"seedrow\">\u003Cspan class=\"n\">5\u003C\u002Fspan>Seed\u003C\u002Fdiv>\u003C\u002Fdiv>\r\n            \u003Cdiv class=\"matchup\">\u003Cdiv class=\"seedrow\">\u003Cspan class=\"n\">9\u003C\u002Fspan>Seed\u003C\u002Fdiv>\u003Cdiv class=\"seedrow\">\u003Cspan class=\"n\">8\u003C\u002Fspan>Seed\u003C\u002Fdiv>\u003C\u002Fdiv>\r\n            \u003Cdiv class=\"matchup\">\u003Cdiv class=\"seedrow\">\u003Cspan class=\"n\">11\u003C\u002Fspan>Seed\u003C\u002Fdiv>\u003Cdiv class=\"seedrow\">\u003Cspan class=\"n\">6\u003C\u002Fspan>Seed\u003C\u002Fdiv>\u003C\u002Fdiv>\r\n            \u003Cdiv class=\"matchup\">\u003Cdiv class=\"seedrow\">\u003Cspan class=\"n\">10\u003C\u002Fspan>Seed\u003C\u002Fdiv>\u003Cdiv class=\"seedrow\">\u003Cspan class=\"n\">7\u003C\u002Fspan>Seed\u003C\u002Fdiv>\u003C\u002Fdiv>\r\n          \u003C\u002Fdiv>\r\n          \u003Cdiv>\r\n            \u003Cdiv class=\"bracket-round-label\">CFP Quarterfinals \u003Cspan>\u003Ca href=\"\u002Fsports\u002F2021\u002F9\u002F7\u002Ffiesta-bowl.aspx\">Fiesta\u003C\u002Fa> &middot; \u003Ca href=\"\u002Fsports\u002F2021\u002F9\u002F7\u002Fcotton-bowl.aspx\">Cotton\u003C\u002Fa> &middot; \u003Ca href=\"\u002Fsports\u002F2021\u002F9\u002F7\u002Fpeach-bowl.aspx\">Peach\u003C\u002Fa> &middot; \u003Ca href=\"\u002Fsports\u002F2021\u002F9\u002F7\u002Frose-bowl.aspx\">Rose\u003C\u002Fa>\u003C\u002Fspan>\u003C\u002Fdiv>\r\n            \u003Cdiv class=\"matchup\">\u003Cdiv class=\"seedrow\">\u003Cspan class=\"n\">4\u003C\u002Fspan>Seed\u003C\u002Fdiv>\u003C\u002Fdiv>\r\n            \u003Cdiv class=\"matchup\">\u003Cdiv class=\"seedrow\">\u003Cspan class=\"n\">1\u003C\u002Fspan>Seed\u003C\u002Fdiv>\u003C\u002Fdiv>\r\n            \u003Cdiv class=\"matchup\">\u003Cdiv class=\"seedrow\">\u003Cspan class=\"n\">3\u003C\u002Fspan>Seed\u003C\u002Fdiv>\u003C\u002Fdiv>\r\n            \u003Cdiv class=\"matchup\">\u003Cdiv class=\"seedrow\">\u003Cspan class=\"n\">2\u003C\u002Fspan>Seed\u003C\u002Fdiv>\u003C\u002Fdiv>\r\n          \u003C\u002Fdiv>\r\n          \u003Cdiv>\r\n            \u003Cdiv class=\"bracket-round-label\">CFP Semifinals \u003Cspan>\u003Ca href=\"\u002Fsports\u002F2021\u002F9\u002F7\u002Forange-bowl.aspx\">Orange\u003C\u002Fa> &middot; \u003Ca href=\"\u002Fsports\u002F2021\u002F9\u002F7\u002Fsugar-bowl.aspx\">Sugar\u003C\u002Fa>\u003C\u002Fspan>\u003C\u002Fdiv>\r\n            \u003Cdiv class=\"matchup\">\u003Cdiv class=\"seedrow\">CFP Quarterfinal Winner\u003C\u002Fdiv>\u003Cdiv class=\"seedrow\">CFP Quarterfinal Winner\u003C\u002Fdiv>\u003C\u002Fdiv>\r\n            \u003Cdiv class=\"matchup\">\u003Cdiv class=\"seedrow\">CFP Quarterfinal Winner\u003C\u002Fdiv>\u003Cdiv class=\"seedrow\">CFP Quarterfinal Winner\u003C\u002Fdiv>\u003C\u002Fdiv>\r\n          \u003C\u002Fdiv>\r\n          \u003Cdiv>\r\n            \u003Cdiv class=\"bracket-round-label\">CFP National Championship \u003Cspan>\u003Ca href=\"\u002Fsports\u002F2025\u002F2\u002F20\u002F2027vegas.aspx\">Allegiant Stadium \u003Cbr \u002F>\u003C\u002Fb>Las Vegas, Nevada\u003C\u002Fa>\u003C\u002Fspan>\u003C\u002Fdiv>\r\n            \u003Cdiv class=\"matchup champ\">\u003Cdiv class=\"seedrow\">CFP Semifinal Winner\u003C\u002Fdiv>\u003Cdiv class=\"seedrow\">CFP Semifinal Winner\u003C\u002Fdiv>\u003C\u002Fdiv>\r\n\r\n          \u003C\u002Fdiv>\r\n      \u003C\u002Fdiv>\r\n    \u003C\u002Fsection>\r\n\r\n    \u003C!-- ================= SCHEDULE ================= -->\r\n    \u003Csection class=\"format-section\" id=\"schedule\">\r\n      \u003Ch2>2026-27 CFP Schedule\u003C\u002Fh2>\r\n      \u003Cp class=\"muted full-width\">Dates and bowl assignments for the 2026-27 CFP, from the CFP First Round hosted on campus by the higher-ranked seeds, through the CFP Quarterfinals and CFP Semifinals, culminating in Las Vegas at the 2027 CFP National Championship.\u003C\u002Fp>\r\n\r\n      \u003Cdiv class=\"schedule-grid\">\r\n        \u003Cdiv class=\"schedule-card\">\r\n          \u003Cdiv class=\"round\">CFP First Round \u003Cspan style=\"text-transform:none;color:var(--color-text-muted);font-weight:600;\">&middot; Higher Seed Hosts\u003C\u002Fspan>\u003C\u002Fdiv>\r\n          \u003Cdiv class=\"date\">Fri., Dec. 18, 2026\u003C\u002Fdiv>\r\n          \u003Cdiv class=\"game\">One game\u003C\u002Fdiv>\r\n          \u003Cdi
