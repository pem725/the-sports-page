<text x="325.0" y="227.0" font-size="14" font-weight="600" fill="#1a1208" text-anchor="middle">Run the ball</text>
<rect x="480" y="200" width="190" height="44" rx="6" fill="#f5f0e8" stroke="#1a1208" stroke-width="1.6"/>
