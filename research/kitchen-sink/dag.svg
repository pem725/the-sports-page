<svg class="chart" viewBox="0 0 680 270" role="img" aria-label="Diagram of causes. Team quality, which the box score cannot see, leads to a lead and to running well. A lead leads to winning and to running the ball. Running the ball leads to time of possession. A dashed arrow from time of possession to winning, marked with a question mark, is the arrow the broadcast draws." style="max-width:680px;margin:0 auto" font-family="'Roboto Mono',monospace">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#1a1208"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#b83a1e"/></marker></defs>
