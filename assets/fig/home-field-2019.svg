<text x="44" y="448" font-size="11.5" font-weight="700" fill="#1a1208">2019 HAD FULL HOUSES AND NO HOME EDGE. 2020 HAD NEITHER, AND LOOKED THE SAME.</text>
<text x="44" y="466" font-size="10.5" fill="#6b5e4a">The two are not separable from each other (t = 0.15). Both are separable from the three seasons before them.</text>
