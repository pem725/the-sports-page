<text x="515.0" y="344" font-size="11" text-anchor="middle" fill="#1a1208">Correlation with the second half of the season</text>
<text x="44" y="392" font-size="11.5" font-weight="700" fill="#1a1208">POSSESSION GOES FROM +0.216 TO &#8722;0.003. IT WAS THE SCOREBOARD ALL ALONG.</text>
<text x="44" y="410" font-size="10.5" fill="#6b5e4a">320 team-seasons, 2016-2025. Teams hold the ball because they are ahead, not the other way round.</text>
