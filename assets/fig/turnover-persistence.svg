<rect width="880" height="360" fill="#f5f0e8"/>
<text x="44" y="30" font-size="16.5" font-weight="700" fill="#1a1208">WHAT A TEAM CARRIES INTO NEXT SEASON</text>
<text x="44" y="50" font-size="11.5" fill="#6b5e4a">Share of next season explained by this one. 288 team-seasons, 2016-2025.</text>
