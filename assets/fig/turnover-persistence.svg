<text x="373.9" y="292" font-size="10" text-anchor="middle" fill="#6b5e4a" font-family="Roboto Mono, monospace">5%</text>
<line x1="537.8" y1="78" x2="537.8" y2="274" stroke="#c8b99a" stroke-width="0.7" stroke-dasharray="3,3"/>
<text x="537.8" y="292" font-size="10" text-anchor="middle" fill="#6b5e4a" font-family="Roboto Mono, monospace">10%</text>
<line x1="701.7" y1="78" x2="701.7" y2="274" stroke="#c8b99a" stroke-width="0.7" stroke-dasharray="3,3"/>
<text x="701.7" y="292" font-size="10" text-anchor="middle" fill="#6b5e4a" font-family="Roboto Mono, monospace">15%</text>
<text x="196" y="111.0" font-size="12.5" text-anchor="end" fill="#1a1208">yards per play margin</text>
<rect x="210" y="95.0" width="504.8" height="22" fill="#2c4a6e" opacity=".85"/>
<text x="724.8" y="112.0" font-size="12" fill="#2c4a6e" font-family="Roboto Mono, monospace" font-weight="700">15.4%</text>
<text x="196" y="184.0" font-size="12.5" text-anchor="end" fill="#1a1208">win rate</text>
<rect x="210" y="168.0" width="445.8" height="22" fill="#2c4a6e" opacity=".85"/>
<text x="665.8" y="185.0" font-size="12" fill="#2c4a6e" font-family="Roboto Mono, monospace" font-weight="700">13.6%</text>
<text x="196" y="257.0" font-size="12.5" text-anchor="end" fill="#1a1208">turnover margin</text>
