<text x="318.3" y="258.0" font-size="12" fill="#b83a1e" font-family="Roboto Mono, monospace" font-weight="700">3.0%</text>
<text x="44" y="322" font-size="11.5" font-weight="700" fill="#1a1208">TURNOVER MARGIN CARRIES THREE PERCENT. IT IS A COIN THAT ALREADY LANDED.</text>
<text x="44" y="340" font-size="10.5" fill="#6b5e4a">How a team moves the ball repeats. How the ball bounces does not.</text>
