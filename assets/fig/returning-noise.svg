<text x="76" y="52" font-size="11.5" fill="#5a4c38">Correlation between returning production and how far a club beat its preseason rating in week one.</text>
<text x="76" y="68" font-size="11.5" fill="#5a4c38">If the effect were real the dots would sit on one side of the line. They do not.</text>
