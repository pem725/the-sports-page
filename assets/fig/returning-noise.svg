<text x="76" y="396" font-size="12" font-weight="700" fill="#1a1208">FOUR SEASONS SAY ONE THING. THREE SAY THE OPPOSITE. FOUR SAY NOTHING.</text>
<text x="76" y="414" font-size="11.5" fill="#5a4c38">A pattern that changes sign is not a small effect. It is the absence of one, seen through forty games at a time.</text>
