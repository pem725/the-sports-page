<svg class="chart" viewBox="0 0 720 372" role="img" aria-label="A scatter of all thirty clubs. The vertical axis is the share of the season a club spent likely to make the playoffs; the horizontal axis is when that hope lived, from all-in-April on the left to all-in-August on the right. Green dots, still alive, cluster to the right. Red dots, eliminated, cluster to the left and along the bottom. The Mets sit at the very bottom left with almost no area at all."><text x="0" y="16" font-family="'Roboto Mono',monospace" font-size="12.5" fill="#1a1208">HOW MUCH HOPE, AND WHEN IT ARRIVED</text><text x="0" y="33" font-family="'Roboto Mono',monospace" font-size="10.5" fill="#6b5e4a">Up the page: the share of the season a club spent likely to make the playoffs.</text><text x="0" y="49" font-family="'Roboto Mono',monospace" font-size="10.5" fill="#6b5e4a">Across: when that hope lived. Left = all in April. Right = all in August.</text><line x1="397" y1="66" x2="397" y2="306" stroke="#c8b99a" stroke-width="1.2" stroke-dasharray="3 4"/><text x="397" y="60" text-anchor="middle" font-family="'Roboto Mono',monospace" font-size="9" fill="#6b5e4a">evenly spread</text><line x1="112" y1="243.5" x2="596" y2="243.5" stroke="#c8b99a" stroke-width="1" stroke-dasharray="2 4"/><text x="104" y="246.5" text-anchor="end" font-family="'Roboto Mono',monospace" font-size="9.5" fill="#6b5e4a">25%</text><line x1="112" y1="187.0" x2="596" y2="187.0" stroke="#c8b99a" stroke-width="1" stroke-dasharray="2 4"/><text x="104" y="190.0" text-anchor="end" font-family="'Roboto Mono',monospace" font-size="9.5" fill="#6b5e4a">50%</text><line x1="112" y1="130.5" x2="596" y2="130.5" stroke="#c8b99a" stroke-width="1" stroke-dasharray="2 4"/><text x="104" y="133.5" text-anchor="end" font-family="'Roboto Mono',monospace" font-size="9.5" fill="#6b5e4a">75%</text><circle cx="165.0" cy="286.3" r="5.5" fill="#b83a1e" opacity="0.95"/><text x="175.0" y="296.3" text-anchor="start" font-family="'Roboto Mono',monospace" font