<svg viewBox="0 0 720 340" role="img" aria-label="Two curves rising from left to right against the gap between two teams in ranks. The blue curve is how often the better-ranked team actually won, starting at 48.7 percent for teams one to two ranks apart. The gold curve is how often 25 rating systems agreed on the order, starting at about 55 percent. A red dashed line marks 75 percent, the just-noticeable-difference criterion. Neither curve reaches it until the gap is around ten ranks."><text x="0" y="15" font-family="'Roboto Mono',monospace" font-size="12.5" fill="#1a1208">HOW FAR APART BEFORE A RANKING MEANS ANYTHING</text><text x="0" y="31" font-family="'Roboto Mono',monospace" font-size="10.5" fill="#6b5e4a">Two independent tests. 493 ranked-vs-ranked games (2015&#8211;25); 25 rating systems, 9,453 pairs.</text><line x1="110" y1="243.2" x2="650" y2="243.2" stroke="#6b5e4a" stroke-width="1.6" stroke-dasharray="4 4"/><text x="656" y="247.2" font-family="'Roboto Mono',monospace" font-size="9.5" fill="#6b5e4a">coin flip</text><line x1="110" y1="138.6" x2="650" y2="138.6" stroke="#b83a1e" stroke-width="2.4" stroke-dasharray="8 5"/><text x="656" y="142.6" font-family="'Roboto Mono',monospace" font-size="9.5" fill="#b83a1e">the 75% line</text><text x="102" y="246.2" text-anchor="end" font-family="'Roboto Mono',monospace" font-size="9.5" fill="#6b5e4a">50%</text><text x="102" y="204.4" text-anchor="end" font-family="'Roboto Mono',monospace" font-size="9.5" fill="#6b5e4a">60%</text><text x="102" y="162.5" text-anchor="end" font-family="'Roboto Mono',monospace" font-size="9.5" fill="#6b5e4a">70%</text><text x="102" y="120.7" text-anchor="end" font-family="'Roboto Mono',monospace" font-size="9.5" fill="#6b5e4a">80%</text><text x="102" y="78.9" text-anchor="end" font-family="'Roboto Mono',monospace" font-size="9.5" fill="#6b5e4a">90%</text><polyline fill="none" stroke="#2c4a6e" stroke-width="2.8" points="155.0,248.5 245.0,227.5 335.0,206.3 425.0,191.8 515.0,127.0 605.0,105.3"/><circle cx="155.0" cy="248.5" r="4.4" fill="#2c4a6e"/><circle cx="245.0" cy="227.5" r="4.4" fill="#2c4a6e"/><circle cx="335.0" cy="206.3" r="4.4" fill="#2c4a6e"/><circle cx="425.0" cy="191.8" r="4.4" fill="#2c4a6e"/><circle cx="515.0" cy="127.0" r="4.4" fill="#2c4a6e"/><circle cx="605.0" cy="105.3" r="4.4" fill="#2c4a6e"/><polyline fill="none" stroke="#c9962a" stroke-width="2.8" points="155.0,217.9 245.0,188.7 335.0,166.2 425.0,135.8 515.0,107.4 605.0,81.8"/><circle cx="155.0" cy="217.9" r="4.4" fill="#c9962a"/><circle cx="245.0" cy="188.7" r="4.4" fill="#c9962a"/><circle cx="335.0" cy="166.2" r="4.4" fill="#c9962a"/><circle cx="425.0" cy="135.8" r="4.4" fill="#c9962a"/><circle cx="515.0" cy="107.4" r="4.4" fill="#c9962a"/><circle cx="605.0" cy="81.8" r="4.4" fill="#c9962a"/><text x="155.0" y="303.0" text-anchor="middle" font-family="'Roboto Mono',monospace" font-size="9.5" fill="#6b5e4a">1–2</text><text x="245.0" y="303.0" text-anchor="middle" font-family="'Roboto Mono',monospace" font-size="9.5" fill="#6b5e4a">3–4</text><text x="335.0" y="303.0" text-anchor="middle" font-family="'Roboto Mono',monospace" font-size="9.5" fill="#6b5e4a">5–7</text><text x="425.0" y="303.0" text-anchor="middle" font-family="'Roboto Mono',monospace" font-size="9.5" fill="#6b5e4a">8–11</text><text x="515.0" y="303.0" text-anchor="middle" font-family="'Roboto Mono',monospace" font-size="9.5" fill="#6b5e4a">12–16</text><text x="605.0" y="303.0" text-anchor="middle" font-family="'Roboto Mono',monospace" font-size="9.5" fill="#6b5e4a">17–25</text><text x="380.0" y="321" text-anchor="middle" font-family="'Roboto Mono',monospace" font-size="10" fill="#1a1208">GAP BETWEEN THE TWO TEAMS, IN RANKS</text><circle cx="118" cy="61" r="4.4" fill="#2c4a6e"/><text x="128" y="65" font-family="'Roboto Mono',monospace" font-size="10" fill="#1a1208">did the better-ranked team win?</text><circle cx="118" cy="79" r="4.4" fill="#c9962a"/><text x="128" y="83" font-family="'Roboto Mono',monospace" font-size="