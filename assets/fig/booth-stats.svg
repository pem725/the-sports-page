<text x="44" y="578" font-size="11.5" font-weight="700" fill="#1a1208">EIGHT OF THESE TWELVE FALL INTO THE SHADED STRIP. THEY WERE THE SCOREBOARD.</text>
<text x="44" y="596" font-size="10.5" fill="#6b5e4a">5,278 games, 2016-2025. Each stat measured over a team&#8217;s first half and scored against its second half, which it never saw.</text>
<text x="44" y="614" font-size="10.5" fill="#6b5e4a">Third down percentage is the most-cited rate on television. Once you know the score it is worth +0.03.</text>
