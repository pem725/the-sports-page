t-family="'Roboto Mono',monospace" font-size="8" fill="#6b5e4a">n=253 won, 72 lost</text><circle cx="236" cy="64" r="5" fill="#2a6e3f"/><text x="247" y="68" font-family="'Roboto Mono',monospace" font-size="9.6" fill="#1a1208">won week 1</text><circle cx="350" cy="64" r="5" fill="#b83a1e"/><text x="361" y="68" font-family="'Roboto Mono',monospace" font-size="9.6" fill="#1a1208">lost week 1</text><line x1="0" y1="290" x2="700" y2="290" stroke="#c8b99a" stroke-width="1"/><text x="0" y="311" font-family="'Roboto Mono',monospace" font-size="10.5" fill="#1a1208">THE GAP IS THERE IN EVERY BAND. IT IS NOT THAT GOOD TEAMS WIN OPENERS.</text><text x="0" y="327" font-family="'Roboto Mono',monospace" font-size="10" fill="#6b5e4a">Worth about 1.5 wins even after talent and returning production are accounted for.</text></svg>