<svg class="chart" viewBox="0 0 720 340" role="img" aria-label="Four rows, one per quarter of recruiting talent. In each, a red dot marks the final winning percentage of clubs that lost their opening game and a green dot those that won it, joined by a bar. The green dot is to the right in every band, by between 1.4 and 1.9 wins."><text x="0" y="16" font-family="'Roboto Mono',monospace" font-size="12.5" fill="#1a1208">ONE GAME, AT EVERY LEVEL OF TALENT</text><text x="0" y="33" font-family="'Roboto Mono',monospace" font-size="10.5" fill="#6b5e4a">1,297 team-seasons, 2015&#8211;2025. Final winning percentage, split by whether the club</text><text x="0" y="49" font-family="'Roboto Mono',monospace" font-size="10.5" fill="#6b5e4a">won its opening game. Clubs are grouped by recruiting talent, so like meets like.</text><line x1="298" y1="82" x2="298" y2="258" stroke="#c8b99a" stroke-width="1" stroke-dasharray="2 4"/><text x="298" y="274" text-anchor="middle" font-family="'Roboto Mono',monospace" font-size="9.5" fill="#6b5e4a">0.400</text><line x1="392" y1="82" x2="392" y2="258" stroke="#c8b99a" stroke-width="1" stroke-dasharray="2 4"/><text x="392" y="274" text-anchor="middle" font-family="'Roboto Mono',monospace" font-size="9.5" fill="#6b5e4a">0.500</text><line x1="487" y1="82" x2="487" y2="258" stroke="#c8b99a" stroke-width="1" stroke-dasharray="2 4"/><text x="487" y="274" text-anchor="middle" font-family="'Roboto Mono',monospace" font-size="9.5" fill="#6b5e4a">0.600</text><line x1="581" y1="82" x2="581" y2="258" stroke="#c8b99a" stroke-width="1" stroke-dasharray="2 4"/><text x="581" y="274" text-anchor="middle" font-family="'Roboto Mono',monospace" font-size="9.5" fill="#6b5e4a">0.700</text><text x="222" y="107" text-anchor="end" font-family="'Roboto Mono',monospace" font-size="10" font-weight="700" fill="#1a1208">bottom quarter by talent</text><line x1="289.7" y1="104" x2="403.8" y2="104" stroke="#c8b99a" stroke-width="2.6"/><circle cx="289.7" cy="104" r="6" fill="#b83a