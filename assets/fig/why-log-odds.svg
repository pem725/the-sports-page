<text x="74" y="32" font-size="16" font-weight="700" fill="#1a1208">THE SAME EDGE, ADDED IN THE SAME PLACE, IS WORTH DIFFERENT AMOUNTS</text>
<text x="74" y="52" font-size="11.5" fill="#5a4c38">Home field is one number in log-odds: +0.14. Read across to see what it buys a club at each strength.</text>
<text x="74" y="68" font-size="11.5" fill="#5a4c38">The curve is flat at the ends and steep in the middle, which is exactly why a single constant behaves.</text>
