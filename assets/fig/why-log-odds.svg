<text x="74" y="446" font-size="11.5" font-weight="700" fill="#1a1208">ONE CONSTANT. THREE ANSWERS: +3.5 POINTS, +2.9, +1.2.</text>
<text x="74" y="462" font-size="11" fill="#5a4c38">That is why the log exists. Advantages add here; in percentages they do not.</text>
