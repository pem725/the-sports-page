<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="100%" font-family="Libre Baskerville, Georgia, serif">
<rect width="880" height="450" fill="#f5f0e8"/>
<text x="44" y="34" font-size="16.5" font-weight="700" fill="#1a1208">DISAGREEING HARDER WITH THE MARKET DOES NOT HELP</text>
<text x="44" y="54" font-size="11.5" fill="#5a4c38">2,140 games, 2024&#8211;2025. How often our pick beat the spread, grouped by how far our number sat from the line.</text>
<text x="44" y="70" font-size="11.5" fill="#5a4c38">If the model knew anything, the bars would climb to the right. They do not.</text>
<line x1="120" y1="252.9" x2="710" y2="252.9" stroke="#1a1208" stroke-width="1.5"/>
<text x="716" y="256.9" font-size="10" fill="#1a1208" font-family="Roboto Mono, monospace">a coin flip</text>
<line x1="120" y1="212.4" x2="710" y2="212.4" stroke="#b83a1e" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="716" y="216.4" font-size="10" fill="#b83a1e" font-family="Roboto Mono, monospace">break even at &#8722;110</text>
<text x="108" y="324.3" font-size="10" fill="#7a6a52" text-anchor="end" font-family="Roboto Mono, monospace">46%</text>
<text x="108" y="290.6" font-size="10" fill="#7a6a52" text-anchor="end" font-family="Roboto Mono, monospace">48%</text>
<text x="108" y="256.9" font-size="10" fill="#7a6a52" text-anchor="end" font-family="Roboto Mono, monospace">50%</text>
<text x="108" y="223.1" font-size="10" fill="#7a6a52" text-anchor="end" font-family="Roboto Mono, monospace">52%</text>
<text x="108" y="189.4" font-size="10" fill="#7a6a52" text-anchor="end" font-family="Roboto Mono, monospace">54%</text>
<text x="108" y="155.7" font-size="10" fill="#7a6a52" text-anchor="end" font-family="Roboto Mono, monospace">56%</text>
<rect x="159.4" y="252.9" width="67.2" height="11.8" fill="#2c4a6e" opacity=".78"/>
<text x="193.0" y="281.7" font-size="12.5" font-weight="700" fill="#2c4a6e" text-anchor="middle" font-family="Roboto Mono, monospace">49.3%</text>
<text x="193.0" y="376.0" font-size="11" fill="#1a1208" text-anchor="middle">0-3 pts</text>
<text x="193.0" y="391.0" font-size="9.5" fill="#7a6a52" text-anchor="middle" font-family="Roboto Mono, monospace">n=980</text>
<rect x="305.4" y="193.9" width="67.2" height="59.0" fill="#c9962a" opacity=".78"/>
<text x="339.0" y="184.9" font-size="12.5" font-weight="700" fill="#c9962a" text-anchor="middle" font-family="Roboto Mono, monospace">53.5%</text>
<text x="339.0" y="376.0" font-size="11" fill="#1a1208" text-anchor="middle">3-6 pts</text>
<text x="339.0" y="391.0" font-size="9.5" fill="#7a6a52" text-anchor="middle" font-family="Roboto Mono, monospace">n=620</text>
<rect x="451.4" y="234.3" width="67.2" height="18.5" fill="#2c4a6e" opacity=".78"/>
<text x="485.0" y="225.3" font-size="12.5" font-weight="700" fill="#2c4a6e" text-anchor="middle" font-family="Roboto Mono, monospace">51.1%</text>
<text x="485.0" y="376.0" font-size="11" fill="#1a1208" text-anchor="middle">6-10 pts</text>
<text x="485.0" y="391.0" font-size="9.5" fill="#7a6a52" text-anchor="middle" font-family="Roboto Mono, monospace">n=354</text>
<rect x="597.4" y="234.3" width="67.2" height="18.5" fill="#2c4a6e" opacity=".78"/>
<text x="631.0" y="225.3" font-size="12.5" font-weight="700" fill="#2c4a6e" text-anchor="middle" font-family="Roboto Mono, monospace">51.1%</text>
<text x="631.0" y="376.0" font-size="11" fill="#1a1208" text-anchor="middle">10+ pts</text>
<text x="631.0" y="391.0" font-size="9.5" fill="#7a6a52" text-anchor="middle" font-family="Roboto Mono, monospace">n=186</text>
<text x="412" y="410" font-size="10.5" fill="#5a4c38" text-anchor="middle" font-style="italic">how far our rating sat from the closing line</text>
<text x="44" y="424" font-size="12" font-weight="700" fill="#1a1208">51.0% OVERALL. THE INTERVAL RUNS FROM 48.9% TO 53.1%.</text>
<text x="44" y="441" font-size="11.5" fill="#5a4c38">It contains 50. We cannot reject the claim that the model knows nothing at all.</text>
</svg>