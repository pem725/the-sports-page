<svg class="chart" viewBox="0 0 720 330" role="img" aria-label="A line showing how many percentage points of playoff probability the Mets would gain from a 14-game winning streak, depending on when it started. The line rises from about 12 points on April 20 to a peak of 26 points on May 18, stays near 23 through late June, then collapses to about 3 points on June 29 after the team went 3 and 10, and stays near 1 point through August."><text x="0" y="15" font-family="'Roboto Mono',monospace" font-size="12.5" fill="#1a1208">WHAT A 14-GAME WINNING STREAK IS WORTH TO THE METS</text><text x="0" y="31" font-family="'Roboto Mono',monospace" font-size="10.5" fill="#6b5e4a">Playoff probability gained, in percentage points, if the streak started on that date.</text><text x="0" y="46" font-family="'Roboto Mono',monospace" font-size="10.5" fill="#6b5e4a">20,000 simulated seasons per point, from the real standings and the real schedule.</text><line x1="92" y1="268.0" x2="650" y2="268.0" stroke="#6b5e4a" stroke-width="1.1" stroke-dasharray="3 4"/><text x="84" y="271.0" text-anchor="end" font-family="'Roboto Mono',monospace" font-size="9.5" fill="#6b5e4a">0</text><line x1="92" y1="198.7" x2="650" y2="198.7" stroke="#6b5e4a" stroke-width="1.1" stroke-dasharray="3 4"/><text x="84" y="201.7" text-anchor="end" font-family="'Roboto Mono',monospace" font-size="9.5" fill="#6b5e4a">10</text><line x1="92" y1="129.4" x2="650" y2="129.4" stroke="#6b5e4a" stroke-width="1.1" stroke-dasharray="3 4"/><text x="84" y="132.4" text-anchor="end" font-family="'Roboto Mono',monospace" font-size="9.5" fill="#6b5e4a">20</text><polyline fill="none" stroke="#2c4a6e" stroke-width="3" points="92.0,181.4 154.0,177.8 216.0,88.5 278.0,108.4 340.0,102.8 402.0,112.7 464.0,245.7 526.0,258.1 588.0,260.8 650.0,256.6"/><circle cx="92.0" cy="181.4" r="4.2" fill="#2c4a6e"/><text x="92.0" y="285" text-anchor="middle" font-family="'Roboto Mono',monospace" font-size="8.6" fill="#6b5e4a">Apr 20</text><text x="92.0" y="298" text-anchor="middle" font-family="'Roboto Mono',monospace" font-size="8.4" fill="#b83a1e">6</text><circle cx="154.0" cy="177.8" r="4.2" fill="#2c4a6e"/><text x="154.0" y="285" text-anchor="middle" font-family="'Roboto Mono',monospace" font-size="8.6" fill="#6b5e4a">May 4</text><text x="154.0" y="298" text-anchor="middle" font-family="'Roboto Mono',monospace" font-size="8.4" fill="#b83a1e">7</text><circle cx="216.0" cy="88.5" r="4.2" fill="#2c4a6e"/><text x="216.0" y="285" text-anchor="middle" font-family="'Roboto Mono',monospace" font-size="8.6" fill="#6b5e4a">May 18</text><text x="216.0" y="298" text-anchor="middle" font-family="'Roboto Mono',monospace" font-size="8.4" fill="#b83a1e">6</text><circle cx="278.0" cy="108.4" r="4.2" fill="#2c4a6e"/><text x="278.0" y="285" text-anchor="middle" font-family="'Roboto Mono',monospace" font-size="8.6" fill="#6b5e4a">Jun 1</text><text x="278.0" y="298" text-anchor="middle" font-family="'Roboto Mono',monospace" font-size="8.4" fill="#b83a1e">6</text><circle cx="340.0" cy="102.8" r="4.2" fill="#2c4a6e"/><text x="340.0" y="285" text-anchor="middle" font-family="'Roboto Mono',monospace" font-size="8.6" fill="#6b5e4a">Jun 15</text><text x="340.0" y="298" text-anchor="middle" font-family="'Roboto Mono',monospace" font-size="8.4" fill="#b83a1e">6</text><circle cx="402.0" cy="112.7" r="4.2" fill="#2c4a6e"/><text x="402.0" y="285" text-anchor="middle" font-family="'Roboto Mono',monospace" font-size="8.6" fill="#6b5e4a">Jun 22</text><text x="402.0" y="298" text-anchor="middle" font-family="'Roboto Mono',monospace" font-size="8.4" fill="#b83a1e">6</text><circle cx="464.0" cy="245.7" r="4.2" fill="#2c4a6e"/><text x="464.0" y="285" text-anchor="middle" font-family="'Roboto Mono',monospace" font-size="8.6" fill="#6b5e4a">Jun 29</text><text x="464.0" y="298" text-anchor="middle" font-family="'Roboto Mono',monospace" font-size="8.4" fill="#b83a1e">10</text><circle cx="526.0" cy="258.1" r="4.2" fill="#2c4a6e"/><text x="526.0" y="285" text-an