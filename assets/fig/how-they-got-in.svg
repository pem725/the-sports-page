<svg class="chart" viewBox="0 0 720 380" role="img" aria-label="Four horizontal intervals, one per group of playoff teams sorted by how likely they looked at the season midpoint. Clubs that surged from nowhere won 44.6 percent of their playoff series, those that climbed late 52.9, comfortable clubs 43.1, and clubs that cruised all year 57.4. All four confidence intervals overlap one another and all four cross or nearly cross the 50 percent line."><text x="0" y="16" font-family="'Roboto Mono',monospace" font-size="12.5" fill="#1a1208">DID IT MATTER HOW THEY GOT IN?</text><text x="0" y="33" font-family="'Roboto Mono',monospace" font-size="10.5" fill="#6b5e4a">250 clubs that reached the postseason, 1998&#8211;2025, grouped by how likely they looked</text><text x="0" y="49" font-family="'Roboto Mono',monospace" font-size="10.5" fill="#6b5e4a">at the season&#8217;s midpoint. Share of their playoff series won, with 95% intervals.</text><line x1="439" y1="76" x2="439" y2="270" stroke="#1a1208" stroke-width="1.6" stroke-dasharray="5 4"/><text x="439" y="70" text-anchor="middle" font-family="'Roboto Mono',monospace" font-size="9.5" fill="#1a1208">a coin flip</text><line x1="285" y1="80" x2="285" y2="270" stroke="#c8b99a" stroke-width="1" stroke-dasharray="2 4"/><line x1="362" y1="80" x2="362" y2="270" stroke="#c8b99a" stroke-width="1" stroke-dasharray="2 4"/><line x1="516" y1="80" x2="516" y2="270" stroke="#c8b99a" stroke-width="1" stroke-dasharray="2 4"/><line x1="593" y1="80" x2="593" y2="270" stroke="#c8b99a" stroke-width="1" stroke-dasharray="2 4"/><text x="236" y="98" text-anchor="end" font-family="'Roboto Mono',monospace" font-size="11" font-weight="700" fill="#1a1208">surged from nowhere</text><text x="236" y="111" text-anchor="end" font-family="'Roboto Mono',monospace" font-size="9" fill="#6b5e4a">1%–41% at midseason</text><text x="236" y="123" text-anchor="end" font-family="'Roboto Mono',monospace" font-size="9" fill="#6b5e4a">45 of 101 series</text><line x1="325.0" y1="96" x2="472.0" y2="96" stroke="#6b5e4a" stroke-width="2.4" opacity=".55"/><line x1="325.0" y1="90" x2="325.0" y2="102" stroke="#6b5e4a" stroke-width="2"/><line x1="472.0" y1="90" x2="472.0" y2="102" stroke="#6b5e4a" stroke-width="2"/><circle cx="397.0" cy="96" r="6" fill="#6b5e4a"/><text x="397.0" y="83" text-anchor="middle" font-family="'Roboto Mono',monospace" font-size="10.5" font-weight="700" fill="#6b5e4a">44.6%</text><text x="236" y="146" text-anchor="end" font-family="'Roboto Mono',monospace" font-size="11" font-weight="700" fill="#1a1208">climbed late</text><text x="236" y="159" text-anchor="end" font-family="'Roboto Mono',monospace" font-size="9" fill="#6b5e4a">42%–74%</text><text x="236" y="171" text-anchor="end" font-family="'Roboto Mono',monospace" font-size="9" fill="#6b5e4a">64 of 121 series</text><line x1="393.0" y1="144" x2="528.2" y2="144" stroke="#6b5e4a" stroke-width="2.4" opacity=".55"/><line x1="393.0" y1="138" x2="393.0" y2="150" stroke="#6b5e4a" stroke-width="2"/><line x1="528.2" y1="138" x2="528.2" y2="150" stroke="#6b5e4a" stroke-width="2"/><circle cx="461.3" cy="144" r="6" fill="#6b5e4a"/><text x="461.3" y="131" text-anchor="middle" font-family="'Roboto Mono',monospace" font-size="10.5" font-weight="700" fill="#6b5e4a">52.9%</text><text x="236" y="194" text-anchor="end" font-family="'Roboto Mono',monospace" font-size="11" font-weight="700" fill="#1a1208">comfortable</text><text x="236" y="207" text-anchor="end" font-family="'Roboto Mono',monospace" font-size="9" fill="#6b5e4a">75%–95%</text><text x="236" y="219" text-anchor="end" font-family="'Roboto Mono',monospace" font-size="9" fill="#6b5e4a">44 of 102 series</text><line x1="315.1" y1="192" x2="460.8" y2="192" stroke="#6b5e4a" stroke-width="2.4" opacity=".55"/><line x1="315.1" y1="186" x2="315.1" y2="198" stroke="#6b5e4a" stroke-width="2"/><line x1="460.8" y1="186" x2="460.8" y2="198" stroke="#6b5e4a" stroke-width="2"/><circle cx="386.0" cy="192" r="6" fill="#6b5e4a"/><text x="386.0