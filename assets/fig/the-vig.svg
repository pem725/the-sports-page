<text x="26" y="229.0" font-size="11" text-anchor="middle" fill="#1a1208" transform="rotate(-90 26 229.0)">Profit per bet, $110 risked</text>
<text x="44" y="460" font-size="11.5" font-weight="700" fill="#1a1208">THE CROWD SPLITS THE GAME IN HALF. THE PRICE DOES NOT.</text>
<text x="44" y="480" font-size="10.5" fill="#6b5e4a">Two sides at &#8722;110 imply 52.38% each, and 52.38 twice is 104.76. That surplus is the house, and it never plays a down.</text>
